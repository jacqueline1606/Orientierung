name: APK bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bauen
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK umbenennen
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Peilung-1.0.${{ github.run_number }}.apk

      - name: Als Build-Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: Peilung-1.0.${{ github.run_number }}
          path: out/*.apk

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Peilung 1.0.${{ github.run_number }}
          body: |
            Automatisch gebaut aus ${{ github.sha }}.
            APK herunterladen und auf dem Android-Handy installieren
            (Installation aus unbekannten Quellen erlauben).
          files: out/*.apk
          make_latest: true
